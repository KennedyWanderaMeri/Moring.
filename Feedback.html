<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeedBack</title>
    <style>
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #001e4d;
  font-family: sans-serif;
}header {
      background: linear-gradient(135deg, #004225, #007a3d);
      color: #ffffff;
      text-align: center;
      padding:20px;
      border: #004225 100%;
    }


p {
    width: 100%;
    border: 0cap;
    text-align: left;
    display: flex;
}
#contactForm {
  width: 90vw;
  max-width: 400px;
  padding: 1.5rem;
  background: #fff;
  border-radius: 10px;
}
.form-group { margin-bottom: 1rem; }
label { display: block; font-weight: bold; margin-bottom: 0.3rem; }
input, textarea, button {
  width: 100%;
  padding: 0.6rem;
  box-sizing: border-box;
  font: inherit;
}
button {
  color: #fff;
  background: #001e4d;
  border: 0;
  cursor: pointer;

}

/* Footer */
    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.9rem;
      color: #666;
    }
    </style>
</head>
<body>
<header>
    <h1>Rugby Quiz Hub</h1>
    <p>Test your match knowledge to relearn the wisdom.
        
    </p>
  </header>


    <section>
<p> Great sport for human life. The form collects the data for young people, players and fans for deveolpment.</p>
</section>
<section>
<form id="contactForm">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Your Name" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Your Email" required />
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" rows="4" placeholder="Your Message or Quiz Suggestion" required></textarea>
        </div>
        <button type="submit">Send Message</button>
      </form>

</section>
<footer> 
    <p>&copy; 2026 Rugby Quiz Hub. All rights reserved.</p>
    <br>wanderaken1@gmail.com<br>
</footer>
<script>
const form = document.getElementById("contactForm");

form.addEventListener("submit", e => {
  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const message = document.getElementById("message").value.trim();

  const saved = JSON.parse(localStorage.getItem("feedback")) || [];
  saved.push({ email, message });
  localStorage.setItem("feedback", JSON.stringify(saved));

  form.reset();
  alert("Thanks! Your message was saved.");
});


 </script>

</body>
</html>
